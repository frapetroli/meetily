# Vendored copy of whisper-rs-sys 0.11.1 (originally from crates.io), patched locally --
# see docs/adr/0018-vendoring-whisper-rs-sys-bindgen-072-bug-msvc.md (docs workspace, not
# in this repo) for why. Two changes vs. the upstream 0.11.1 release:
#   1. bindgen bumped 0.69 -> 0.72 (0.69 mis-parses whisper_full_params's anonymous nested
#      structs against some libclang builds, collapsing them to an opaque struct).
#   2. build.rs forces the static CRT (/MT) on MSVC targets -- see
#      docs/adr/0019-crt-statico-whisper-cpp-windows-conflitto-sherpa-onnx-sys.md.
# Wired in via [patch.crates-io] in the workspace root Cargo.toml. Re-evaluate this
# vendoring if/when upstream whisper-rs/whisper-rs-sys picks up an equivalent fix.

[package]
edition = "2021"
name = "whisper-rs-sys"
version = "0.11.1"
build = "build.rs"
links = "whisper"
include = [
    "whisper.cpp/bindings/javascript/package-tmpl.json",
    "whisper.cpp/bindings/CMakeLists.txt",
    "whisper.cpp/CMakeLists.txt",
    "whisper.cpp/cmake",
    "whisper.cpp/src/**",
    "whisper.cpp/include/whisper.h",
    "whisper.cpp/ggml/cmake",
    "whisper.cpp/ggml/CMakeLists.txt",
    "whisper.cpp/ggml/src/**",
    "whisper.cpp/ggml/include/*.h",
    "whisper.cpp/LICENSE",
    "src/*.rs",
    "build.rs",
    "wrapper.h",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust bindings for whisper.cpp (FFI bindings)"
documentation = "https://docs.rs/whisper-rs-sys"
readme = false
license = "Unlicense"
repository = "https://github.com/tazz4843/whisper-rs"

[lib]
name = "whisper_rs_sys"
path = "src/lib.rs"

[build-dependencies.bindgen]
version = "0.72"

[build-dependencies.cfg-if]
version = "1"

[build-dependencies.cmake]
version = "0.1"

[build-dependencies.fs_extra]
version = "1.3"

[features]
coreml = []
cuda = []
force-debug = []
hipblas = []
metal = []
openblas = []
openmp = []
vulkan = []
